# This file generates the GitHub Actions matrix.
# Normal artifacts are native-wireless Corne v4 halves for nice!nano v2-compatible
# controllers with nice_oled, plus a settings_reset utility artifact. The pinned
# upstream ZMK revision exposes generic corne_left/right shields rather than a
# separate corne_v4 shield, so do not invent unsupported custom hardware here.
---
include:
  - board: nice_nano/nrf52840/zmk
    shield: corne_left nice_oled
    artifact-name: corne_v4_left
  - board: nice_nano/nrf52840/zmk
    shield: corne_right nice_oled
    artifact-name: corne_v4_right
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
