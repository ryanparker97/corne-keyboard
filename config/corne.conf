# -----------------------------------------------------
# 1. CẤU HÌNH TẮT NÚM XOAY (ENCODER)
# -----------------------------------------------------
# Tắt driver cho encoder
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# -----------------------------------------------------
# 2. ĐỘ NHẠY CAO & KẾT NỐI (Đã tối ưu)
# -----------------------------------------------------
# Debounce uses the current Corne shield/devicetree defaults.
# Avoid deprecated KSCAN debounce Kconfig overrides on current ZMK.

# Bluetooth stability for fast typing on macOS
# Avoid forced 2M PHY for better compatibility/range on Mac BLE. ZMK documents
# this experimental connection option as improving stability and currently
# disabling 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Request an Apple-compliant 15 ms interval. Equal 15 ms min/max is explicitly
# allowed for BLE HID; the 30-event peripheral latency preserves idle battery life
# without delaying a report that is ready to send. Use a 6 s supervision timeout.
# The host negotiates the final values, so these remain preferences, not guarantees.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Give bursts of fast keypresses more room before BLE notifications catch up.
# ZMK default is 20 keyboard reports; 40 is a conservative fast-typing bump.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40

# Give matrix and split-central position events more room so press/release events
# are less likely to be dropped before they become host reports.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16

# Keep transmit power high for link margin; this can increase battery drain.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Ổn định kết nối
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# -----------------------------------------------------
# 3. RGB UNDERGLOW
# -----------------------------------------------------
# Enable ZMK's supported RGB underglow behavior. This requires compatible
# underglow LEDs/wiring on the physical board and can increase battery drain.
# Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# -----------------------------------------------------
# 4. CÁC THIẾT LẬP KHÁC
# -----------------------------------------------------
# Màn hình OLED: use zmk-nice-oled's 128x32 SSD1306 nice_oled shield.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_WIDGET_STATUS=y

# Central OLED: Luna dog WPM animation; keep Bongo Cat variants disabled.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

# Peripheral OLED: keep zmk-nice-oled's default cat art/animation explicit.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# Quản lý nguồn (Ngủ sau 5 phút)
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_EXT_POWER=y

# ZMK Studio is intentionally not enabled globally.
# The right half is a split peripheral and cannot satisfy ZMK_USB dependencies.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
