# Encoder hardware is not used by this 42-key Corne build.
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# Use the current Corne shield/devicetree debounce defaults. Do not restore
# deprecated KSCAN debounce Kconfig overrides.

# Host-compatible Bluetooth behavior. At the pinned ZMK revision this aggregate
# option selects connection/security experiments, including disabling 2M PHY.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Request a 15 ms interval, 30-event peripheral latency, and 6 s supervision
# timeout. The Windows host negotiates the final connection parameters.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Keep the pinned ZMK defaults for report, scan, and split queues. Avoid
# speculative queue, PHY, ACL, data-length, and GATT overrides.

# Preserve radio link margin; this may increase battery use.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# RGB underglow is intentionally disabled. The keymap therefore has no RGB bindings.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Preserve the branch's display support without adding an OLED shield to build.yaml.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Power management: idle after one minute and sleep after five minutes.
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_EXT_POWER=y

# USB is configured per target: corne_left.conf enables host USB and
# corne_right.conf disables it. ZMK Studio is not enabled.
