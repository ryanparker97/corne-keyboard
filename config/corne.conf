# ######################################################
## General

# --- High-Speed Typing / Low Latency ---
# Debounce is owned by the &kscan0 node in config/corne.keymap (3 ms press and
# release). Do not set CONFIG_ZMK_KSCAN_DEBOUNCE_*_MS anywhere: a value of 0 or
# more overrides the devicetree value, and the build log shows -1 (unset) today.


### Power & Wireless (Mac Optimized)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Keep the nRF52840 radio at +8 dBm for the existing split/host range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# In pinned ZMK v0.3, this improves compatibility by disabling the 2M PHY.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# EXPERIMENT 8: request a 11.25-26.25 ms interval range so macOS can pick the
# fastest link it will grant. Checked against Apple QA1931 (BLE Accessory Design
# Guidelines R8):
#   - Min + 15 ms <= Max: 11.25 + 15 = 26.25 ms, met exactly.
#   - Min == Max == 15 ms is avoided: Apple says some devices scale that to 30 ms.
#   - Min below 15 ms relies on the BLE HID exception (down to 11.25 ms "may be
#     accepted"). It is not in the newer guidance I could find; if macOS rejects
#     it, fall back to MIN_INT=12, MAX_INT=24 (15-30 ms, fully compliant).
#   - Max * (latency + 1) = 26.25 * 31 = 814 ms <= 2 s; x3 = 2.4 s < timeout.
# Shortest connection interval requested, in units of 1.25 ms (9 = 11.25 ms).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
# Longest connection interval requested, in units of 1.25 ms (21 = 26.25 ms).
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=21
# Connection events the keyboard may skip when idle to save power (Apple max 30).
# It does not delay key presses: the keyboard transmits at the next event when
# it has data.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
# Link supervision timeout, in units of 10 ms (600 = 6 s). Apple's older rules
# allow 2-6 s and newer guidance quotes 6-18 s, so 6 s satisfies both.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Buffer fast typing bursts while BLE notifications and split events catch up.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16

# Basic consumer usages have broader macOS media-key compatibility.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# ######################################################
## RGB Underglow (LED Modes)

# EXPERIMENT 6: RGB off to test whether it causes the constant lag. The display
# line below has no effect while nice_oled is in build.yaml: nice_oled.conf is
# merged after this file and sets CONFIG_ZMK_DISPLAY=y.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=y

# Ensure all effects are compiled in
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Auto turn-off features to save battery
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Fine-tuning steps for RGB cycling
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# Default starting colors and brightness
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=80
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# ######################################################
## OLED Display
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
