# -----------------------------------------------------
# 1. CẤU HÌNH TẮT NÚM XOAY (ENCODER)
# -----------------------------------------------------
# Tắt driver cho encoder
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# -----------------------------------------------------
# 2. ĐỘ NHẠY CAO & KẾT NỐI (Đã tối ưu)
# -----------------------------------------------------
# Debounce uses the current Corne shield/devicetree defaults.
# Avoid deprecated KSCAN debounce Kconfig overrides on current ZMK.

# Bluetooth stability for fast typing on Windows.
# Experimental features aggregate both connection (2M PHY disable) and security
# (passkey entry) fixes which are highly recommended for Windows 11 compatibility.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Request a 15 ms interval. The 30-event peripheral latency preserves idle battery
# life without delaying a report that is ready to send. Use a 6 s supervision timeout.
# The host negotiates the final values, so these remain preferences, not guarantees.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Give bursts of fast keypresses more room before BLE notifications catch up.
# ZMK default is 20 keyboard reports; 40 is a conservative fast-typing bump.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40

# Give matrix and split-central position events more room so press/release events
# are less likely to be dropped before they become host reports.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16

# Keep transmit power high for link margin; this can increase battery drain.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Ổn định kết nối
# Removed custom low-level BT settings (ACL_RX_SIZE, DATA_LENGTH_MAX) as they
# frequently interfere with the split peripheral connecting to the central side.

# -----------------------------------------------------
# 3. TIẾT KIỆM PIN (Tắt LED)
# -----------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=n

# -----------------------------------------------------
# 4. CÁC THIẾT LẬP KHÁC
# -----------------------------------------------------
# Màn hình OLED (Vẫn giữ)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Quản lý nguồn (Ngủ sau 5 phút)
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_EXT_POWER=y

# ZMK Studio is intentionally not enabled globally.
# The right half is a split peripheral and cannot satisfy ZMK_USB dependencies.
