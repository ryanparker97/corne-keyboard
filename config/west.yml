manifest:
  defaults:
    # Track current ZMK so the Corne shield, Studio options, and user-config
    # workflow stay aligned. Pin this only after recording a known-good ZMK commit or tag
    # from a successful full firmware build; do not choose an arbitrary revision.
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
  self:
    path: config
