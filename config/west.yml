manifest:
  defaults:
    # Pin the exact ZMK revision for reproducible local and CI builds.
    # Keep this aligned with the reusable workflow ref. Full firmware
    # compilation still needs confirmation via GitHub Actions or local west.
    revision: 6e2ef41e022d555b10f116e395832913f71717b3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: chyuuu
      url-base: https://github.com/chyuuu
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-nice-oled
      remote: chyuuu
      revision: b2d5cd914b2180cb53766b0302c75818400d2f58
  self:
    path: config
