# The left half is the split central and the only host-facing USB target.
# This file is merged after corne.conf by the pinned ZMK build logic.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Use the broadly compatible six-key report and USB boot protocol for
# BIOS/UEFI and BitLocker pre-boot input.
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
CONFIG_ZMK_USB_BOOT=y
