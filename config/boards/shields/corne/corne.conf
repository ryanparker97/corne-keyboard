# NOTE: the CI build does not load this file. The build log merges only
# config/corne.conf, corne_left.conf / corne_right.conf, nice_oled.conf and the
# Studio snippet, so the settings below have no effect today. They are kept
# unchanged until it is decided whether to activate or delete them.
# Debounce, RGB, display and Studio settings used to be duplicated here; they
# now live in exactly one live file each (see config/corne.conf and corne_left.conf).

# Battery report interval, in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Default keyboard name shown to the host
CONFIG_ZMK_KEYBOARD_NAME="Corne"
# Works around a Windows battery-report bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
