# Left half (built with the studio-rpc-usb-uart snippet).
# RGB underglow and display settings live in config/corne.conf for both halves.

# ZMK Studio. The lock is deliberately off and the keymap has no &studio_unlock
# binding; dropping the two =n lines would lock Studio with no way to unlock it.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

